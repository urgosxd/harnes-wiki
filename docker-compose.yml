# Self-contained stack: no host directory is mounted into the agent server.
# The container writes its own Pi model configuration from environment variables,
# so it can be started on any machine that has a provider key, and the image never
# carries credentials.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agentdoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentdocumentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentdocumentor}
      POSTGRES_DB: agentdocumentor
    ports:
      # Loopback only: reachable for development tooling, never from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - agentdoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdocumentor -d agentdocumentor"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal

  server:
    build:
      context: ./server
    container_name: agentdoc-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The service generates its own models.json from these. Nothing is mounted.
      PI_AGENT_CONFIG_MODE: generate
      CHAT_PROVIDER: ${CHAT_PROVIDER:-synthetic}
      CHAT_MODEL: ${CHAT_MODEL:-syn:large:text}
      CHAT_API: ${CHAT_API:-openai-completions}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://api.synthetic.new/openai/v1}
      # No `:?` here on purpose. Compose interpolates the whole file for every
      # command, so a required variable would make `docker compose down`, `ps` and
      # `logs` fail too. The server validates it at startup instead and names it.
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_CONTEXT_WINDOW: ${CHAT_CONTEXT_WINDOW:-524288}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-65536}
      CHAT_REASONING: ${CHAT_REASONING:-true}
      CHAT_THINKING_LEVEL: ${CHAT_THINKING_LEVEL:-medium}
      # Neutral workspace: Pi appends a <cwd> section to the system prompt.
      PI_WORKSPACE_DIR: /data/workspace
      DATABASE_URL: postgres://agentdocumentor:${POSTGRES_PASSWORD:-agentdocumentor}@postgres:5432/agentdocumentor
      # An EXTERNAL ingest service, called server-side only (it validates its own
      # request headers and offers no browser CORS). The service lives in another
      # repository and is deployed separately: how it is started is not this
      # project's concern, and this value must be the address it accepts.
      # Empty means "not configured", and the ingest routes then answer 503
      # instead of pretending to be fine.
      INGEST_API_BASE_URL: ${INGEST_API_BASE_URL:-}
      INGEST_API_TIMEOUT_MS: ${INGEST_API_TIMEOUT_MS:-10000}
      # Origin the ingest service reaches THIS container at. A capability URL is
      # handed to another container, so a relative path or the browser's origin
      # would name the wrong process. Empty keeps uploads working but disables
      # ingest-by-document, since there would be no URL to hand over.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://server:8080}
      # Two users, each with their own secret: `id:token,id:token`. The token is
      # what identifies the caller, so holding bob's token does not let anyone act
      # as alice. Tokens must be at least 16 characters; the server refuses
      # anything shorter at startup.
      CHAT_USERS: ${CHAT_USERS:?CHAT_USERS must be set, e.g. alice:token-alice-1234567890,bob:token-bob-1234567890}
      # Capabilities the model gets. Invisible in the UI either way.
      # AGENT_BASH stays off by default: a shell cannot be confined to the
      # workspace, and the provider key lives one directory above it.
      AGENT_READ_TOOLS: ${AGENT_READ_TOOLS:-true}
      AGENT_SKILLS: ${AGENT_SKILLS:-true}
      AGENT_BASH: ${AGENT_BASH:-false}
      AGENT_WRITES: ${AGENT_WRITES:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8080"
      NODE_ENV: production
    volumes:
      # Only the service's own data volume: generated config, session workspace.
      - agentdoc-workspace:/data/workspace
    healthcheck:
      # /health needs no credentials, so container health does not depend on a secret.
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:8080/health")
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No published port: only the web container reaches the API.
    networks:
      - internal

  web:
    build:
      context: ./web
    container_name: agentdoc-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  agentdoc-pgdata:
  agentdoc-workspace:
