# Production: consume published images, never build them.
#
# This file exists so the two activities stop sharing one configuration. Development
# (`docker-compose.yml`) builds from the source tree and is the only place a compiler
# is needed. Production pulls an artefact that was already built and, when the
# registry is in play, already pushed — so the host needs no source, no Node and no
# package manager.
#
# ## Why `image:` and not `build:`
#
# A `build:` key would make `up` compile on the target host. That silently defeats
# the point of publishing a multi-arch image: the arm64 machine would rebuild from
# source instead of using the arm64 image that was tested, and "what is deployed"
# would stop being a name you can point at.
#
# ## Why `latest`, and what that costs
#
# Both services deploy the `latest` tag, so a target host needs no version variable to
# start a stack. The cost is that `latest` moves: the tag no longer identifies a build.
# What replaces it is the image digest — `deploy.sh` resolves and prints the digest of
# each image between `pull` and `up`, which is the only exact reference to what ran.
#
#   REGISTRY=ghcr.io/your-user docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml up -d   # local images
#
# ## What is NOT duplicated from the development file
#
# Nothing structural: the network, the volumes, the healthchecks and the environment
# contract are the same, because a production stack that behaves differently from the
# one that was tested is not the same product. Only the two service definitions change
# their origin (image instead of build) and lose the source-tree bindings — including
# the skills and agents ones. Production reads NOTHING from the host: skills and agent
# definitions both live in named volumes seeded from the image on first boot, so this file
# plus the two images is a complete deployment. A bind to `./server/skills` or
# `./server/agents` would make the checkout a deployment requirement and would start a
# stack carrying only this file with zero skills — or zero definitions, which fails the
# boot — and no error explaining it. That is the failure this arrangement exists to remove.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agentdoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentdocumentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: agentdocumentor
    # Loopback only. Reachable for `psql` and for provisioning scripts, never from
    # the network. On a shared host this is the difference between a database and a
    # database somebody else can enumerate.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentdoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdocumentor -d agentdocumentor"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal

  server:
    # REGISTRY is OPTIONAL here on purpose: `${REGISTRY:+...}` prefixes only when it
    # has a value, so a stack built on this host runs from the local images while a
    # deployment pulls from a registry. The tag is `latest` in both cases; the digest
    # `deploy.sh` prints at deploy time is what pins it after the fact.
    image: ${REGISTRY:+${REGISTRY}/}agentdocumentor-server:latest
    container_name: agentdoc-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The service generates its own models.json from these. Nothing is mounted.
      PI_AGENT_CONFIG_MODE: generate
      CHAT_PROVIDER: ${CHAT_PROVIDER:-synthetic}
      CHAT_MODEL: ${CHAT_MODEL:-syn:large:text}
      CHAT_API: ${CHAT_API:-openai-completions}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://api.synthetic.new/openai/v1}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_CONTEXT_WINDOW: ${CHAT_CONTEXT_WINDOW:-524288}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-65536}
      CHAT_REASONING: ${CHAT_REASONING:-true}
      CHAT_THINKING_LEVEL: ${CHAT_THINKING_LEVEL:-medium}
      PI_WORKSPACE_DIR: /data/workspace
      DATABASE_URL: postgres://agentdocumentor:${POSTGRES_PASSWORD}@postgres:5432/agentdocumentor
      # How callers are identified. `password` is the default HERE, and it is the only mode
      # the browser can use: everyone signs in through `POST /api/login` with their own user
      # and password, and the identity comes from the `sid` cookie. Nothing is read from the
      # query string or from a request header, so no link can sign anybody in.
      #
      # The legacy modes are opt-in and this file never selects one. `open` behind a private
      # network is a legitimate choice and a compose file that refused the operator's
      # decision would be a second product. `roster` restores per-user tokens (a claimed id
      # that disagrees with the token is refused with `401`, and tokens shorter than 16
      # characters stop the boot), but it is API-only: the web client has no token field, so
      # the browser answers `401` forever. Falling back to `roster` here was the same class
      # of mistake — a production boot nobody could sign into — which is why the fallback is
      # `password` and a legacy mode now has to be named on purpose.
      AUTH_MODE: ${AUTH_MODE:-password}
      # The accounts a fresh database starts with: `id:password,id:password`. Empty is the
      # normal state — `alice` and `bob` are then created at the first boot with a generated
      # password printed ONCE in the server log, so that log stream is sensitive until the
      # password is saved somewhere. An account that already exists is never rewritten.
      #
      # Forwarded explicitly because `deploy/env.prod.example` sets it: Compose interpolates
      # the env file, but only what this block names reaches the container, so an unlisted
      # value would be silently ignored and every deployment would invent its own passwords.
      DEFAULT_USERS: ${DEFAULT_USERS:-}
      # DEPRECATED — legacy `roster` mode only. Read when AUTH_MODE=roster (or as the
      # inference fallback when AUTH_MODE is unset); the default password path never consults
      # it, because identity there is a row in `users`. Kept because roster mode and its
      # tests still use it, and empty is its normal state: the roster arrives through the
      # mount below, and this variable exists so an orchestrator secret can OVERRIDE that
      # file — the entrypoint gives it precedence.
      CHAT_USERS: ${CHAT_USERS:-}
      INGEST_API_BASE_URL: ${INGEST_API_BASE_URL:-}
      INGEST_API_TIMEOUT_MS: ${INGEST_API_TIMEOUT_MS:-10000}
      # Deadline for ONE MCP tool request, in milliseconds. A tool that outlives it comes
      # back to the model as a tool error, not a failed turn. The fallback matches the
      # server's own default; the server logs the effective value once at startup.
      MCP_REQUEST_TIMEOUT_MS: ${MCP_REQUEST_TIMEOUT_MS:-120000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://server:8080}
      AGENT_READ_TOOLS: ${AGENT_READ_TOOLS:-true}
      AGENT_SKILLS: ${AGENT_SKILLS:-true}
      AGENT_BASH: ${AGENT_BASH:-false}
      AGENT_WRITES: ${AGENT_WRITES:-false}
      # Agent definitions are a NAMED volume in production (see `volumes` below), never a
      # repo path: the deployment consumes an immutable artefact, and a host bind would
      # make the checkout a deployment requirement. The path and the selected definition
      # stay interpolated so an `.env` value is honored; the default is the volume's own
      # mount point, which is where the image's seed is copied on a first boot.
      PI_AGENTS_DIR: ${PI_AGENTS_DIR:-/home/node/.agents/agents}
      AGENT_DEFINITION: ${AGENT_DEFINITION:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8080"
      NODE_ENV: production
    volumes:
      - agentdoc-workspace:/data/workspace
      # Skills, as a NAMED volume — not a host bind. Inside the workspace on purpose: Pi
      # discovers project skills at <cwd>/.pi/skills and the model's `read` tool is
      # confined to the workspace, so anywhere else a skill is indexed and unreadable.
      #
      # The volume starts empty and the image carries a seed at
      # /opt/agentdocumentor/skills that `entrypoint.sh` copies in on a first boot. That
      # is what makes this file self-sufficient: a host that has the two images and this
      # file gets the skills. The seed lives at neither discovery scope, so there is one
      # copy of each skill, not two.
      #
      # A mount that already has content is never overwritten: an operator who copies
      # their own skills in owns them. To refresh from a newer image, remove the volume
      # (`docker volume rm <project>_agentdoc-skills`) or copy over it.
      - agentdoc-skills:/data/workspace/.pi/skills
      # Agent definitions, as a NAMED volume at the scope the server reads
      # (`PI_AGENTS_DIR`, `$HOME/.agents/agents`), for the same reason the skills volume
      # exists: production reads no host path. This used to be a baked copy at this exact
      # path, which made "correct a bad role instruction" a rebuild and a release; now the
      # mount is the source the server re-reads on EVERY turn (`src/pi/agent-role.ts`), so
      # a fix is a `cp` into the volume and the next message uses it — no restart, no
      # rebuild, no new tag.
      #
      # The volume starts empty and the image carries a seed at
      # /opt/agentdocumentor/agents that `entrypoint.sh` copies in on a first boot, which
      # is what keeps this file self-sufficient. A mount that already has content is never
      # overwritten: an operator who corrected a role owns it. To refresh from a newer
      # image, remove the volume (`docker volume rm <project>_agentdoc-agents`) or copy
      # over it.
      - agentdoc-agents:/home/node/.agents/agents
      # The per-user roster: the ONE host path this file reads, and it is read-only.
      #
      # Everything else here is a named volume because a deployment should need no source
      # tree, and this is the deliberate exception. The alternative was `.env`, which
      # Compose interpolates into every service that names the variable and which an
      # operator copies between hosts by hand — a token does not belong in a file that
      # also carries sixteen other settings.
      #
      # So: one line of secrets, in one file, at a path the operator owns (`chmod 600`,
      # git-ignored), mounted read-only and read once at boot by `entrypoint.sh`, which
      # exports `CHAT_USERS` from it. Rotating a user is editing this file and restarting
      # the server container; nothing is baked into an image and nothing is committed.
      #
      # A missing host file is created here as an EMPTY DIRECTORY by Docker; under
      # `AUTH_MODE=roster` — the only mode that reads it — the entrypoint then STOPS the
      # boot and says so, rather than starting a server that refuses every request. The
      # default `AUTH_MODE=password` path never looks at this mount.
      - ./.chat-users:/run/secrets/chat-users:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:8080/health")
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No published port: only the web container reaches the API.
    #
    # `wiki-link`: the hub's network, created by llm-wiki-compiler's
    # docker-compose.hub.yml (start that stack first). It is joined, not
    # redefined — the hub binds a fixed IP there and validates the request's
    # `Host` header against it, so the address in INGEST_API_BASE_URL and in the
    # tenant_mcp row has to be that same literal address.
    networks:
      - internal
      - wiki-link

  web:
    image: ${REGISTRY:+${REGISTRY}/}agentdocumentor-web:latest
    container_name: agentdoc-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Loopback only: a reverse proxy with TLS publishes this, not Docker.
      - "127.0.0.1:8088:80"
    networks:
      - internal
      # Caddy's network (its own compose project, `external: true`). The Caddyfile
      # proxies wiki.<domain> to `agentdoc-web:80`, so this container has to be
      # resolvable there by that exact name — container_name is the alias. Without
      # it Caddy answers 502: it cannot even resolve the upstream.
      - proxiable

networks:
  internal:
    driver: bridge

  # Owned by llm-wiki-compiler's docker-compose.hub.yml, which creates it with a
  # fixed subnet and gives the hub a fixed IP. Declared `external` here on
  # purpose: recreating this stack must not try to create it, and `up` should
  # fail loudly ("network not found") if the hub was never started, because a
  # server without this network answers every wiki tool call with a dead socket.
  wiki-link:
    name: wiki-link
    external: true

  # Owned by the caddy compose project (/home/urgosxd/Desktop/caddy), which
  # publishes 80/443. Joined here so that proxy can reach `agentdoc-web:80` by
  # name; the 8088 loopback port stays for local checks and scripts.
  proxiable:
    name: proxiable
    external: true

volumes:
  agentdoc-pgdata:
  agentdoc-workspace:
  # Seeded from the image on the first boot of the server container (see
  # `server/entrypoint.sh`), then owned by whoever put content there.
  agentdoc-skills:
  # The agent definitions: seeded the same way, and read PER TURN by the server, so a
  # corrected role takes effect on the next message with no restart.
  agentdoc-agents:
