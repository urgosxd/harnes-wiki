# Production: consume published images, never build them.
#
# This file exists so the two activities stop sharing one configuration. Development
# (`docker-compose.yml`) builds from the source tree and is the only place a compiler
# is needed. Production pulls an artefact that was already built and, when the
# registry is in play, already pushed — so the host needs no source, no Node and no
# package manager.
#
# ## Why `image:` and not `build:`
#
# A `build:` key would make `up` compile on the target host. That silently defeats
# the point of publishing a multi-arch image: the arm64 machine would rebuild from
# source instead of using the arm64 image that was tested, and "what is deployed"
# would stop being a name you can point at.
#
# ## Why the tags are required
#
# `VERSION` has no default. A deployment must be able to say exactly which build it
# runs; a `latest` that moves on its own makes an incident impossible to bisect.
#
#   REGISTRY=ghcr.io/your-user VERSION=0.1.0 docker compose -f docker-compose.prod.yml up -d
#   VERSION=0.1.0 docker compose -f docker-compose.prod.yml up -d   # local images
#
# ## What is NOT duplicated from the development file
#
# Nothing structural: the network, the volumes, the healthchecks and the environment
# contract are the same, because a production stack that behaves differently from the
# one that was tested is not the same product. Only the two service definitions change
# their origin (image instead of build) and lose the source-tree bindings.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agentdoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentdocumentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: agentdocumentor
    # Loopback only. Reachable for `psql` and for provisioning scripts, never from
    # the network. On a shared host this is the difference between a database and a
    # database somebody else can enumerate.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentdoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdocumentor -d agentdocumentor"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal

  server:
    # REGISTRY is OPTIONAL here on purpose: `${REGISTRY:+...}` prefixes only when it
    # has a value, so a stack built on this host runs from the local images while a
    # deployment pulls from a registry. VERSION is required in both cases, because a
    # deployment has to name exactly which build it runs.
    image: ${REGISTRY:+${REGISTRY}/}agentdocumentor-server:${VERSION:?VERSION must be set, e.g. 0.1.0}
    container_name: agentdoc-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The service generates its own models.json from these. Nothing is mounted.
      PI_AGENT_CONFIG_MODE: generate
      CHAT_PROVIDER: ${CHAT_PROVIDER:-synthetic}
      CHAT_MODEL: ${CHAT_MODEL:-syn:large:text}
      CHAT_API: ${CHAT_API:-openai-completions}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://api.synthetic.new/openai/v1}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_CONTEXT_WINDOW: ${CHAT_CONTEXT_WINDOW:-524288}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-65536}
      CHAT_REASONING: ${CHAT_REASONING:-true}
      CHAT_THINKING_LEVEL: ${CHAT_THINKING_LEVEL:-medium}
      PI_WORKSPACE_DIR: /data/workspace
      DATABASE_URL: postgres://agentdocumentor:${POSTGRES_PASSWORD}@postgres:5432/agentdocumentor
      # How callers are identified. `open` means the name in the link IS the
      # identity and there is no secret behind it. See the README before exposing
      # this to anyone.
      AUTH_MODE: ${AUTH_MODE:-open}
      CHAT_USERS: ${CHAT_USERS:-}
      INGEST_API_BASE_URL: ${INGEST_API_BASE_URL:-}
      INGEST_API_TIMEOUT_MS: ${INGEST_API_TIMEOUT_MS:-10000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://server:8080}
      AGENT_READ_TOOLS: ${AGENT_READ_TOOLS:-true}
      AGENT_SKILLS: ${AGENT_SKILLS:-true}
      AGENT_BASH: ${AGENT_BASH:-false}
      AGENT_WRITES: ${AGENT_WRITES:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8080"
      NODE_ENV: production
    volumes:
      - agentdoc-workspace:/data/workspace
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:8080/health")
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No published port: only the web container reaches the API.
    networks:
      - internal

  web:
    image: ${REGISTRY:+${REGISTRY}/}agentdocumentor-web:${VERSION:?VERSION must be set, e.g. 0.1.0}
    container_name: agentdoc-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Loopback only: a reverse proxy with TLS publishes this, not Docker.
      - "127.0.0.1:8088:80"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  agentdoc-pgdata:
  agentdoc-workspace:
