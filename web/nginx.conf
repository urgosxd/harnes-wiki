server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The client is a single page: unknown paths are handled by the app, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API is proxied so the browser sees one origin and no CORS is needed.
  location /api/ {
    proxy_pass http://server:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streaming is the whole product. Buffering here would hold every token until
    # the answer finished, which turns live streaming into one late burst.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";

    # A long answer must not be cut by a read timeout. The value matches the
    # server's own expectations; nginx's 60s default is far too short.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
